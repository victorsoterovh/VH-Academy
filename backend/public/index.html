<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VH Soccer — Gestão da Academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-deep:#0D1B3D;
    --pitch-mid:#1868E8;
    --pitch-line:#7FA3E0;
    --chalk:#F3F6FC;
    --paper:#FFFFFF;
    --cone:#D9FF3E;
    --cone-dark:#BEE016;
    --ink:#0F1B2E;
    --muted:#5B6B85;
    --clay:#E0592A;
    --clay-bg:#FCE8DD;
    --fresh:#1868E8;
    --fresh-bg:#E4EDFC;
    --amber:#C98A1F;
    --amber-bg:#FBF0DA;
    --line:#E1E6F0;
    --radius:14px;

    --sport-futsal:#1868E8;
    --sport-futsal-bg:#E4EDFC;
    --sport-beach:#C97A2E;
    --sport-beach-bg:#F7EADA;
    --sport-nat:#1C7293;
    --sport-nat-bg:#E1EEF2;
    --sport-futv:#B23A48;
    --sport-futv-bg:#F5DFE1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--chalk); color:var(--ink);
    font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  h1,h2,h3,.display{font-family:'Anton',sans-serif; letter-spacing:0.02em; text-transform:uppercase; font-weight:400;}

  .topbar{
    background:var(--pitch-deep); color:var(--chalk); padding:16px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background-image:radial-gradient(circle at 90% -20%, rgba(217,255,62,0.14), transparent 55%);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-badge{
    width:42px;height:46px;
    background:linear-gradient(160deg, var(--pitch-mid), var(--pitch-deep) 70%);
    clip-path: polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif; color:var(--cone); font-size:15px;
    border:1.5px solid rgba(217,255,62,0.5); flex-shrink:0;
  }
  .brand-text .display{font-size:19px; line-height:1; color:var(--chalk); margin:0;}
  .brand-text small{color:var(--pitch-line); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase;}

  .tabs{display:flex; gap:4px; background:rgba(0,0,0,0.2); padding:4px; border-radius:999px; flex-wrap:wrap;}
  .tab-btn{
    border:none; background:transparent; color:var(--pitch-line);
    padding:9px 18px; border-radius:999px; font-weight:700; font-size:13px;
    cursor:pointer; letter-spacing:0.02em; transition:all .15s ease;
  }
  .tab-btn.active{background:var(--cone); color:var(--pitch-deep);}
  .tab-btn:not(.active):hover{color:var(--chalk);}
  .tab-btn.sair{opacity:0.75;}

  .wrap{max-width:1080px; margin:0 auto; padding:32px 24px 80px;}
  .wrap-narrow{max-width:640px;}
  .wrap-login{max-width:420px; padding-top:64px;}

  .hero{display:flex; align-items:center; justify-content:space-between; gap:24px; margin-bottom:28px; flex-wrap:wrap;}
  .hero.stack{display:block;}
  .hero .display{font-size:32px; color:var(--pitch-deep); margin:0 0 6px;}
  .hero p{color:var(--muted); margin:0; max-width:520px;}
  .badge-club{
    background:var(--paper); border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; font-size:12px; color:var(--muted); font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--fresh);}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:24px; margin-bottom:18px;}
  .section-label{
    font-size:11px; font-weight:800; color:var(--pitch-mid); text-transform:uppercase;
    letter-spacing:0.08em; margin:0 0 16px; display:flex; align-items:center; gap:8px;
  }
  .section-label.spaced{margin-top:22px;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--line);}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px;}
  .form-grid .full{grid-column:1/-1;}
  .field label{display:block; font-size:11.5px; font-weight:700; color:var(--pitch-deep); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.03em;}
  .field input, .field select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:9px;
    font-family:'Manrope',sans-serif; font-size:14px; background:var(--chalk); color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--pitch-mid); outline-offset:1px; border-color:var(--pitch-mid);}
  .field-hint{font-size:11.5px; color:var(--muted); margin-top:6px;}

  .segmented{display:flex; gap:8px;}
  .seg-opt{
    flex:1; border:1.5px solid var(--line); border-radius:10px; padding:13px; text-align:center;
    cursor:pointer; font-weight:800; font-size:13.5px; color:var(--muted); background:var(--chalk);
    transition:all .12s ease;
  }
  .seg-opt.sel{border-color:var(--pitch-deep); background:var(--pitch-deep); color:var(--cone);}

  .self-note{
    background:var(--sport-futsal-bg); border:1px dashed var(--sport-futsal); border-radius:9px;
    padding:11px 14px; font-size:13px; color:var(--pitch-deep); margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;
  }

  .modalidades{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
  .modalidade-card{
    border:1.5px solid var(--line); border-radius:12px; padding:16px; cursor:pointer;
    display:flex; flex-direction:column; gap:6px; transition:all .12s ease; background:var(--chalk);
  }
  .modalidade-card .icon{font-size:24px;}
  .modalidade-card .nome{font-weight:800; font-size:14px;}
  .modalidade-card .desc{font-size:11.5px; color:var(--muted);}
  .modalidade-card.sel[data-sport="futsal"]{border-color:var(--sport-futsal); background:var(--sport-futsal-bg);}
  .modalidade-card.sel[data-sport="beach"]{border-color:var(--sport-beach); background:var(--sport-beach-bg);}
  .modalidade-card.sel[data-sport="nat"]{border-color:var(--sport-nat); background:var(--sport-nat-bg);}
  .modalidade-card.sel[data-sport="futv"]{border-color:var(--sport-futv); background:var(--sport-futv-bg);}

  .sport-strip{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .sport-pill{
    display:flex; align-items:center; gap:6px; background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700; color:var(--muted);
  }

  .lgpd-note{font-size:11.5px; color:var(--muted); text-align:center; margin-top:12px; line-height:1.5;}

  .btn{
    border:none; border-radius:9px; padding:12px 22px; font-weight:800; font-size:14px;
    cursor:pointer; font-family:'Manrope',sans-serif; letter-spacing:0.01em; transition:transform .1s ease, box-shadow .15s ease;
  }
  .btn-primary{background:var(--pitch-deep); color:var(--chalk);}
  .btn-primary:hover{background:var(--pitch-mid);}
  .btn-cone{background:var(--cone); color:var(--pitch-deep);}
  .btn-cone:hover{background:var(--cone-dark);}
  .btn-cone:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--pitch-deep); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--pitch-mid);}
  .btn:active:not(:disabled){transform:scale(0.98);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px; font-size:12.5px; border-radius:7px;}
  .error-text{color:var(--clay); font-size:13px; font-weight:700; margin:10px 0 0;}

  .confirm-box{text-align:center; padding:48px 24px;}
  .confirm-box .ball{font-size:42px; margin-bottom:12px;}
  .confirm-box .display{font-size:24px; color:var(--pitch-deep); margin:0 0 8px;}
  .confirm-box p{color:var(--muted); margin:0 0 4px; font-size:14px;}
  .confirm-box .protocolo{
    display:inline-block; margin:16px 0 22px; background:var(--chalk); border:1px dashed var(--line);
    border-radius:9px; padding:9px 16px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--pitch-deep);
  }

  /* Login */
  .login-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px;}
  .login-logo .brand-badge{width:56px; height:62px; font-size:20px;}
  .login-logo .display{font-size:22px; color:var(--pitch-deep); margin:0;}
  .login-logo small{color:var(--muted); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;}
  .demo-hint{
    background:var(--fresh-bg); border:1px dashed var(--pitch-mid); border-radius:9px;
    padding:10px 13px; font-size:12px; color:var(--pitch-deep); margin-top:14px; line-height:1.5;
  }

  /* Painel view */
  .filter-row{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
  .filter-chip{
    border:1.5px solid var(--line); background:var(--paper); color:var(--muted);
    padding:8px 16px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:8px;
  }
  .filter-chip .count{background:var(--chalk); border-radius:999px; padding:1px 8px; font-size:11px; color:var(--ink);}
  .filter-chip.active{background:var(--pitch-deep); border-color:var(--pitch-deep); color:var(--chalk);}
  .filter-chip.active .count{background:rgba(255,255,255,0.18); color:var(--chalk);}

  .aluno-row{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; display:flex; align-items:center; gap:16px; margin-bottom:10px;
    cursor:pointer; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .aluno-row:hover{border-color:var(--pitch-mid); box-shadow:0 2px 10px rgba(13,27,61,0.08);}
  .avatar{
    width:44px; height:44px; border-radius:50%; background:var(--pitch-deep); color:var(--cone);
    display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:16px; flex-shrink:0;
  }
  .aluno-info{flex:1; min-width:0;}
  .aluno-info .nome{font-weight:800; font-size:15px;}
  .aluno-info .meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .badge{font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
  .badge-pendente{background:var(--amber-bg); color:var(--amber);}
  .badge-ativo{background:var(--fresh-bg); color:var(--fresh);}
  .badge-inadimplente{background:var(--clay-bg); color:var(--clay);}
  .badge-pago{background:var(--fresh-bg); color:var(--fresh);}
  .badge-atrasado{background:var(--clay-bg); color:var(--clay);}
  .badge-sport[data-sport="futsal"]{background:var(--sport-futsal-bg); color:var(--sport-futsal);}
  .badge-sport[data-sport="beach"]{background:var(--sport-beach-bg); color:var(--sport-beach);}
  .badge-sport[data-sport="nat"]{background:var(--sport-nat-bg); color:var(--sport-nat);}
  .badge-sport[data-sport="futv"]{background:var(--sport-futv-bg); color:var(--sport-futv);}
  .chevron{color:var(--muted); flex-shrink:0;}
  .empty-state{text-align:center; padding:50px 20px; color:var(--muted);}
  .empty-state .ball{font-size:32px; margin-bottom:8px;}

  /* Turmas */
  .modalidade-section{margin-bottom:30px;}
  .modalidade-section .head{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:800; font-size:14px; color:var(--pitch-deep);}
  .turma-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;}
  .turma-card{
    border:1.5px solid var(--line); border-radius:12px; padding:16px; background:var(--paper);
    cursor:pointer; transition:all .12s ease;
  }
  .turma-card:hover{border-color:var(--pitch-mid); box-shadow:0 2px 10px rgba(13,27,61,0.08);}
  .turma-card .nome{font-weight:800; font-size:15px;}
  .turma-card .meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .turma-card .count{margin-top:12px; font-size:12px; font-weight:800; color:var(--pitch-mid);}

  /* Ficha do aluno / detalhes */
  .back-link{
    background:none; border:none; color:var(--pitch-mid); font-weight:700; font-size:13px;
    cursor:pointer; display:flex; align-items:center; gap:6px; margin-bottom:18px; padding:0;
  }
  .ficha-head{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap; margin-bottom:22px;}
  .ficha-title{display:flex; align-items:center; gap:14px;}
  .avatar-lg{
    width:58px; height:58px; border-radius:50%; background:var(--pitch-deep); color:var(--cone);
    display:flex; align-items:center; justify-content:center; font-family:'Anton',sans-serif; font-size:22px;
  }
  .ficha-title .display{font-size:24px; margin:0; color:var(--pitch-deep);}
  .ficha-title .sub{color:var(--muted); font-size:13px; margin-top:2px;}
  .badge-row{display:flex; gap:8px; flex-wrap:wrap;}

  .pitch-tracker{
    background:linear-gradient(180deg, var(--pitch-mid), var(--pitch-deep));
    border-radius:var(--radius); padding:22px 26px 26px; margin-bottom:24px; position:relative; overflow:hidden;
  }
  .pitch-tracker::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0 40px, rgba(255,255,255,0) 40px 80px);
  }
  .pitch-label{color:var(--pitch-line); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.1em; margin-bottom:14px; position:relative;}
  .pitch-track{position:relative; display:flex; align-items:center; justify-content:space-between;}
  .pitch-track::before{content:""; position:absolute; left:18px; right:18px; top:14px; height:2px; background:rgba(255,255,255,0.25);}
  .pitch-stop{position:relative; display:flex; flex-direction:column; align-items:center; gap:8px; flex:1; z-index:1;}
  .pitch-node{
    width:30px; height:30px; border-radius:50%; background:var(--pitch-deep); border:2px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--pitch-line);
  }
  .pitch-node.done{background:var(--cone); border-color:var(--cone); color:var(--pitch-deep);}
  .pitch-node.current{background:var(--chalk); border-color:var(--chalk); color:var(--pitch-deep); box-shadow:0 0 0 5px rgba(255,255,255,0.15);}
  .pitch-stop .stop-label{font-size:11px; color:var(--chalk); font-weight:700; text-align:center;}
  .pitch-stop.inactive .stop-label{color:var(--pitch-line);}

  .info-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;}
  .info-card .section-label{margin-top:0;}
  .info-line{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; gap:12px;}
  .info-line:last-child{border-bottom:none;}
  .info-line .k{color:var(--muted); font-weight:600; flex-shrink:0;}
  .info-line .v{font-weight:700; text-align:right;}

  .hist-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .hist-head .display{font-size:18px; margin:0; color:var(--pitch-deep);}
  table{width:100%; border-collapse:collapse;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); padding:0 12px 10px; border-bottom:2px solid var(--line); font-weight:800;}
  td{padding:13px 12px; border-bottom:1px solid var(--line); font-size:13.5px;}
  tr:last-child td{border-bottom:none;}
  .val-cell{font-family:'JetBrains Mono',monospace; font-weight:600;}
  .invoice-btn{background:var(--pitch-deep); color:var(--cone); border:none; padding:7px 14px; border-radius:7px; font-weight:800; font-size:11.5px; cursor:pointer; white-space:nowrap;}
  .invoice-btn.secondary{background:var(--chalk); color:var(--pitch-deep); border:1px solid var(--line);}
  .invoice-btn:hover{opacity:0.88;}

  /* Client portal */
  .welcome-banner{
    background:linear-gradient(120deg, var(--pitch-deep), var(--pitch-mid)); color:var(--chalk);
    border-radius:var(--radius); padding:24px 26px; margin-bottom:24px;
  }
  .welcome-banner .display{font-size:24px; margin:0 0 4px; color:var(--chalk);}
  .welcome-banner p{margin:0; color:var(--pitch-line); font-size:13.5px;}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(13,27,61,0.55); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{background:var(--paper); border-radius:16px; padding:28px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto;}
  .modal .display{font-size:20px; color:var(--pitch-deep); margin:0 0 4px;}
  .modal .modal-sub{color:var(--muted); font-size:13px; margin:0 0 20px;}
  .radio-row{display:flex; gap:10px; margin-top:8px;}
  .radio-opt{flex:1; border:1.5px solid var(--line); border-radius:9px; padding:12px; text-align:center; cursor:pointer; font-weight:700; font-size:13px; color:var(--muted);}
  .radio-opt.sel{border-color:var(--pitch-deep); background:var(--pitch-deep); color:var(--cone);}
  .modal-actions{display:flex; gap:10px; margin-top:22px;}
  .modal-actions .btn{flex:1;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--pitch-deep); color:var(--chalk); padding:13px 22px; border-radius:999px;
    font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:10px; z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .toast .dot{background:var(--cone);}

  @media (max-width:640px){
    .form-grid{grid-template-columns:1fr;}
    .info-grid{grid-template-columns:1fr;}
    .modalidades{grid-template-columns:1fr;}
    .segmented{flex-direction:column;}
    .hero{flex-direction:column; align-items:flex-start;}
    table{display:block; overflow-x:auto;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-badge">VH</div>
    <div class="brand-text">
      <p class="display">VH Soccer</p>
      <small>La Bombonera · Condomínios</small>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap" id="appWrap"><div id="app"></div></div>

<script>
/* ==========================================================================
   VH Soccer — Frontend integrado com backend real (JWT + fetch)
   ========================================================================== */

const API_BASE = ''; // mesma origem — frontend e backend no mesmo Vercel

/* ---------- Session (localStorage) ---------- */
function saveSession(data){ localStorage.setItem('vh_session', JSON.stringify(data)); state.session=data; }
function loadSession(){ try{ const s=localStorage.getItem('vh_session'); return s?JSON.parse(s):null; }catch{ return null; } }
function clearSession(){ localStorage.removeItem('vh_session'); state.session=null; }

/* ---------- API helper ---------- */
async function apiFetch(path, opts={}){
  const headers={'Content-Type':'application/json'};
  if(state.session?.token) headers['Authorization']='Bearer '+state.session.token;
  let res;
  try{ res=await fetch(API_BASE+path,{...opts,headers:{...headers,...(opts.headers||{})}}); }
  catch(e){ throw new Error('Sem conexão com o servidor.'); }
  if(res.status===401){ clearSession(); state.view='login'; render(); throw new Error('Sessão expirada. Faça login novamente.'); }
  const data=await res.json();
  if(!res.ok) throw new Error(data.erro||'Erro '+res.status);
  return data;
}

/* ---------- Estado global ---------- */
let state={
  session: loadSession(),
  view:'cadastro', filter:'pendentes',
  selectedId:null, selectedTurmaId:null,
  showAprovarModal:null, showCobrancaModal:null, showTurmaModal:null,
  cadastroEnviado:false, protocolo:null,
  loginTab:'admin', loginError:null,
  alunos:[], turmas:[], alunoDetalhe:null,
  turmaAlunos:[], clienteAlunos:[], clienteFilhoDetalhe:null,
  loading:false,
};
if(state.session) state.view=state.session.role==='admin'?'painel':'clientePainel';

const unidades=['Metrópole','Lourdes','Quintas do Sol'];
const modalidades=[
  {id:'futsal',nome:'Futsal',desc:'Infantil e adulto',icon:'⚽'},
  {id:'beach',nome:'Beach Tennis',desc:'Turmas mistas',icon:'🎾'},
  {id:'nat',nome:'Natação',desc:'Todas as idades',icon:'🏊'},
  {id:'futv',nome:'Futevôlei',desc:'Adulto',icon:'🏐'},
];

/* ---------- Form de cadastro ---------- */
let form={atletaTipo:'filho',atletaNome:'',atletaNascimento:'',condominio:'',unidade:'',
  pagadorNome:'',pagadorCpf:'',pagadorEmail:'',pagadorCelular:'',
  cep:'',endereco:'',numero:'',complemento:'',bairro:'',cidade:'',uf:'',modalidade:null};
function resetForm(){ form={atletaTipo:'filho',atletaNome:'',atletaNascimento:'',condominio:'',unidade:'',
  pagadorNome:'',pagadorCpf:'',pagadorEmail:'',pagadorCelular:'',
  cep:'',endereco:'',numero:'',complemento:'',bairro:'',cidade:'',uf:'',modalidade:null}; }

let toastMsg=null;

/* ---------- Helpers ---------- */
const fmtMoney=v=>'R$ '+parseFloat(v).toFixed(2).replace('.',',');
const fmtDate=d=>{ if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
const idade=nasc=>{ const b=new Date(nasc),n=new Date(); let a=n.getFullYear()-b.getFullYear(); if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--; return a; };
const initials=nome=>nome.split(' ').filter(w=>w.length>1).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const modalidadeInfo=id=>modalidades.find(m=>m.id===id)||{nome:'—',icon:''};
const cpfDigits=v=>(v||'').replace(/\D/g,'');
function computeStatus(a){ if(a.status==='pendente') return 'pendente'; return a.inadimplente?'inadimplente':'ativo'; }
function showToast(msg){ toastMsg=msg; renderToastOnly(); setTimeout(()=>{ toastMsg=null; renderToastOnly(); },2800); }

/* ---------- Máscaras + CEP ---------- */
function maskCpf(v){ return v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function maskCelular(v){ return v.replace(/\D/g,'').slice(0,11).replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2'); }
function maskCep(v){ return v.replace(/\D/g,'').slice(0,8).replace(/(\d{5})(\d)/,'$1-$2'); }
async function buscarCep(cepRaw){
  const cep=cepRaw.replace(/\D/g,''); if(cep.length!==8) return;
  try{ const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`),d=await r.json();
    if(!d.erro){ form.endereco=d.logradouro||form.endereco; form.bairro=d.bairro||form.bairro; form.cidade=d.localidade||form.cidade; form.uf=d.uf||form.uf; render(); }
  }catch(e){}
}
function validoForm(){
  return form.atletaNascimento&&form.condominio&&form.unidade&&
    (form.atletaTipo==='proprio'||form.atletaNome)&&
    form.pagadorNome&&cpfDigits(form.pagadorCpf).length===11&&
    form.pagadorEmail.includes('@')&&cpfDigits(form.pagadorCelular).length>=10&&
    form.endereco&&form.numero&&form.bairro&&form.cidade&&form.uf&&form.modalidade;
}

/* ---------- Carregadores de dados ---------- */
async function carregarAlunos(){ state.loading=true; try{ state.alunos=await apiFetch('/api/alunos'); }catch(e){ showToast(e.message); state.alunos=[]; } state.loading=false; }
async function carregarTurmas(){ state.loading=true; try{ state.turmas=await apiFetch('/api/turmas'); }catch(e){ showToast(e.message); state.turmas=[]; } state.loading=false; }
async function carregarFicha(id){ state.loading=true; try{ state.alunoDetalhe=await apiFetch(`/api/alunos/${id}`); }catch(e){ showToast(e.message); state.alunoDetalhe=null; } state.loading=false; }
async function carregarTurmaAlunos(id){ state.loading=true; try{ state.turmaAlunos=await apiFetch(`/api/turmas/${id}/alunos`); }catch(e){ showToast(e.message); state.turmaAlunos=[]; } state.loading=false; }
async function carregarClienteAlunos(){ state.loading=true; try{ state.clienteAlunos=await apiFetch('/api/cliente/alunos'); }catch(e){ showToast(e.message); state.clienteAlunos=[]; } state.loading=false; }
async function carregarClienteFilho(id){ state.loading=true; try{ state.clienteFilhoDetalhe=await apiFetch(`/api/cliente/alunos/${id}`); }catch(e){ showToast(e.message); state.clienteFilhoDetalhe=null; } state.loading=false; }

/* ---------- Navegação com carregamento ---------- */
async function navigate(view){
  state.view=view; state.showAprovarModal=null; state.showCobrancaModal=null; state.showTurmaModal=null;
  render();
  if(view==='painel') await carregarAlunos();
  if(view==='turmas') await carregarTurmas();
  if(view==='ficha'){ await carregarFicha(state.selectedId); await carregarTurmas(); }
  if(view==='turmaDetalhe'){ await carregarTurmas(); await carregarTurmaAlunos(state.selectedTurmaId); }
  if(view==='clientePainel') await carregarClienteAlunos();
  if(view==='clienteFilho') await carregarClienteFilho(state.selectedId);
  render();
}

/* ---------- Tabs ---------- */
function renderTabs(){
  const tabs=document.getElementById('tabs');
  if(!state.session){
    tabs.innerHTML=`
      <button class="tab-btn ${state.view==='cadastro'?'active':''}" data-tab="cadastro">Cadastro</button>
      <button class="tab-btn ${state.view==='login'?'active':''}" data-tab="login">Entrar</button>
    `;
  } else if(state.session.role==='admin'){
    tabs.innerHTML=`
      <button class="tab-btn ${['painel','ficha'].includes(state.view)?'active':''}" data-tab="painel">Alunos</button>
      <button class="tab-btn ${['turmas','turmaDetalhe'].includes(state.view)?'active':''}" data-tab="turmas">Turmas</button>
      <button class="tab-btn sair" data-tab="sair">Sair ↩</button>
    `;
  } else {
    tabs.innerHTML=`
      <button class="tab-btn ${['clientePainel','clienteFilho'].includes(state.view)?'active':''}" data-tab="clientePainel">Meus Atletas</button>
      <button class="tab-btn sair" data-tab="sair">Sair ↩</button>
    `;
  }
  tabs.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.onclick=()=>{
      if(btn.dataset.tab==='sair'){ logout(); return; }
      if(btn.dataset.tab==='cadastro'){ state.cadastroEnviado=false; resetForm(); state.view='cadastro'; render(); return; }
      if(btn.dataset.tab==='login'){ state.loginError=null; state.view='login'; render(); return; }
      navigate(btn.dataset.tab);
    };
  });
}
function logout(){
  clearSession(); state.view='cadastro'; state.loginError=null;
  state.selectedId=null; state.selectedTurmaId=null;
  state.alunos=[]; state.turmas=[]; state.alunoDetalhe=null; state.clienteAlunos=[]; state.clienteFilhoDetalhe=null;
  render();
}

function wireLogin(){
  document.querySelectorAll('[data-login-tab]').forEach(el=>{ el.onclick=()=>{ state.loginTab=el.dataset.loginTab; state.loginError=null; render(); }; });
  const cpfInput=document.querySelector('#loginForm input[name="cpf"]');
  if(cpfInput) cpfInput.oninput=()=>{ cpfInput.value=maskCpf(cpfInput.value); };
  document.getElementById('loginForm').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target),btn=document.getElementById('loginBtn');
    btn.disabled=true; btn.textContent='Entrando...'; state.loginError=null;
    try{
      if(state.loginTab==='admin'){
        const data=await apiFetch('/api/auth/admin/login',{method:'POST',body:JSON.stringify({usuario:f.get('usuario'),senha:f.get('senha')})});
        saveSession({role:'admin',token:data.token});
        await navigate('painel');
      } else {
        const data=await apiFetch('/api/auth/cliente/login',{method:'POST',body:JSON.stringify({cpf:f.get('cpf'),senha:f.get('senha')})});
        saveSession({role:'cliente',token:data.token,nome:data.nome});
        await navigate('clientePainel');
      }
    }catch(err){ state.loginError=err.message; render(); }
  };
}

function renderUnidadeSelect(){
  return `<select required name="unidade"><option value="" ${form.unidade===''?'selected':''} disabled>Selecione</option>${unidades.map(u=>`<option value="${u}" ${form.unidade===u?'selected':''}>${u}</option>`).join('')}</select>`;
}
function wireCadastro(){
  const novo=document.getElementById('novoCadastroBtn');
  if(novo){ novo.onclick=()=>{ state.cadastroEnviado=false; resetForm(); render(); }; return; }
  document.querySelectorAll('.seg-opt[data-tipo]').forEach(el=>{ el.onclick=()=>{ form.atletaTipo=el.dataset.tipo; render(); }; });
  document.querySelectorAll('.modalidade-card').forEach(el=>{ el.onclick=()=>{ form.modalidade=el.dataset.select; render(); }; });
  document.querySelectorAll('#cadastroForm input').forEach(inp=>{
    inp.oninput=()=>{
      let v=inp.value;
      if(inp.name==='pagadorCpf') v=maskCpf(v);
      if(inp.name==='pagadorCelular') v=maskCelular(v);
      if(inp.name==='cep') v=maskCep(v);
      if(inp.name==='uf') v=v.toUpperCase();
      inp.value=v; form[inp.name]=v;
      const btn=document.getElementById('submitBtn'); if(btn) btn.disabled=!validoForm();
    };
    inp.onblur=()=>{ if(inp.name==='cep') buscarCep(form.cep); };
  });
  document.querySelectorAll('#cadastroForm select').forEach(sel=>{ sel.onchange=()=>{ form[sel.name]=sel.value; const btn=document.getElementById('submitBtn'); if(btn) btn.disabled=!validoForm(); }; });
  document.getElementById('cadastroForm').onsubmit=async e=>{
    e.preventDefault(); if(!validoForm()) return;
    const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Enviando...';
    try{
      const data=await apiFetch('/api/cadastros',{method:'POST',body:JSON.stringify({
        atleta:{nome:form.atletaTipo==='proprio'?form.pagadorNome:form.atletaNome,nascimento:form.atletaNascimento,condominio:form.condominio,unidade:form.unidade,modalidade:form.modalidade,tipo:form.atletaTipo},
        pagador:{nome:form.pagadorNome,cpf:form.pagadorCpf,email:form.pagadorEmail,celular:form.pagadorCelular,
          endereco:{cep:form.cep,logradouro:form.endereco,numero:form.numero,complemento:form.complemento,bairro:form.bairro,cidade:form.cidade,uf:form.uf}}
      })});
      state.protocolo=data.protocolo; state.cadastroEnviado=true; render();
    }catch(err){ btn.disabled=false; btn.textContent='Enviar cadastro'; showToast('Erro: '+err.message); }
  };
}

/* ---------- Painel Admin — Alunos ---------- */
function renderPainel(){
  document.getElementById('appWrap').className='wrap';
  if(state.loading) return `<div class="hero"><div><p class="display">Painel Admin</p></div></div>${loadingHTML()}`;
  const list=state.alunos;
  const counts={pendentes:list.filter(a=>computeStatus(a)==='pendente').length,ativos:list.filter(a=>computeStatus(a)==='ativo').length,inadimplentes:list.filter(a=>computeStatus(a)==='inadimplente').length,todos:list.length};
  const map={pendentes:'pendente',ativos:'ativo',inadimplentes:'inadimplente'};
  const filtered=state.filter==='todos'?list:list.filter(a=>computeStatus(a)===map[state.filter]);
  return `
    <div class="hero">
      <div><p class="display">Painel Admin</p><p>Aprove cadastros, defina a turma e acompanhe pagamentos de todos os atletas — de todas as modalidades e unidades.</p></div>
      <div class="badge-club"><span class="dot" style="background:var(--amber);"></span> ${counts.pendentes} aguardando aprovação</div>
    </div>
    <div class="filter-row">
      ${chip('pendentes','Pendentes',counts.pendentes)}${chip('ativos','Ativos',counts.ativos)}${chip('inadimplentes','Inadimplentes',counts.inadimplentes)}${chip('todos','Todos',counts.todos)}
    </div>
    <div id="alunoList">${filtered.length?filtered.map(alunoRow).join(''):emptyState(state.filter)}</div>
  `;
}
function chip(key,label,count){ return `<button class="filter-chip ${state.filter===key?'active':''}" data-filter="${key}">${label} <span class="count">${count}</span></button>`; }
function emptyState(filter){ const msgs={pendentes:'Nenhum cadastro pendente no momento.',ativos:'Nenhum aluno ativo nesse filtro.',inadimplentes:'Ninguém inadimplente por aqui — bom sinal!',todos:'Nenhum aluno cadastrado ainda.'}; return `<div class="empty-state"><div class="ball">⚽</div>${msgs[filter]||'Nenhum resultado.'}</div>`; }
function alunoRow(a){
  const st=computeStatus(a),badgeMap={pendente:['badge-pendente','Pendente'],ativo:['badge-ativo','Ativo'],inadimplente:['badge-inadimplente','Inadimplente']};
  const [cls,label]=badgeMap[st],mod=modalidadeInfo(a.modalidade);
  const sub=a.status==='pendente'?`${mod.icon} ${mod.nome} · ${a.unidade} · ${a.condominio}`:`${mod.icon} ${mod.nome} · ${a.turma_nome?a.turma_nome+' · '+a.turma_horario:'Sem turma'} · ${a.unidade}`;
  return `<div class="aluno-row" data-id="${a.id}"><div class="avatar">${initials(a.nome)}</div><div class="aluno-info"><div class="nome">${a.nome} <span style="color:var(--muted);font-weight:600;font-size:12.5px;">· ${idade(a.nascimento)} anos</span></div><div class="meta">${sub}</div></div><span class="badge ${cls}">${label}</span><span class="chevron">›</span></div>`;
}
function wirePainel(){
  document.querySelectorAll('.filter-chip').forEach(c=>{ c.onclick=()=>{ state.filter=c.dataset.filter; render(); }; });
  document.querySelectorAll('.aluno-row').forEach(r=>{ r.onclick=()=>{ state.selectedId=Number(r.dataset.id); navigate('ficha'); }; });
}

/* ---------- Turmas ---------- */
function renderTurmas(){
  document.getElementById('appWrap').className='wrap';

    <div class="hero">

function wireTurmas(){
  const nb=document.getElementById('novaTurmaBtn'); if(nb) nb.onclick=()=>{ state.showTurmaModal=true; render(); };
  document.querySelectorAll('.turma-card').forEach(c=>{ c.onclick=()=>{ state.selectedTurmaId=c.dataset.turma; navigate('turmaDetalhe'); }; });
}
function renderTurmaDetalhe(){
  document.getElementById('appWrap').className='wrap';
  const t=state.turmas.find(x=>String(x.id)===String(state.selectedTurmaId));
  if(state.loading) return `<button class="back-link" id="backTurmasBtn">← Voltar às turmas</button>${loadingHTML()}`;
  if(!t) return `<button class="back-link" id="backTurmasBtn">← Voltar às turmas</button><div class="empty-state">Turma não encontrada.</div>`;
  const mod=modalidadeInfo(t.modalidade),doTurma=state.turmaAlunos;
  return `
    <button class="back-link" id="backTurmasBtn">← Voltar às turmas</button>
    <div class="hero">
      <div><p class="display">${t.nome}</p><p>${mod.icon} ${mod.nome} · ${t.unidade} · ${t.horario} ${t.capacidade?'· capacidade '+t.capacidade:''}</p></div>
      <div class="badge-club"><span class="dot"></span> ${doTurma.length} matriculado(s)</div>
    </div>
    <div>${doTurma.length?doTurma.map(a=>`<div class="aluno-row" data-id="${a.id}"><div class="avatar">${initials(a.nome)}</div><div class="aluno-info"><div class="nome">${a.nome}</div><div class="meta">${modalidadeInfo(a.modalidade).icon} ${modalidadeInfo(a.modalidade).nome} · ${a.pagador_nome}</div></div><span class="chevron">›</span></div>`).join(''):`<div class="empty-state"><div class="ball">🧍</div>Ninguém matriculado nessa turma ainda.</div>`}</div>
  `;
}
function wireTurmaDetalhe(){
  document.getElementById('backTurmasBtn').onclick=()=>navigate('turmas');
  document.querySelectorAll('.aluno-row').forEach(r=>{ r.onclick=()=>{ state.selectedId=Number(r.dataset.id); navigate('ficha'); }; });
}

/* ---------- Ficha do aluno (admin) ---------- */
function renderFicha(){
  document.getElementById('appWrap').className='wrap';
  if(state.loading) return loadingHTML();
  const a=state.alunoDetalhe;
  if(!a) return `<button class="back-link" id="backBtn">← Voltar</button><div class="empty-state">Aluno não encontrado.</div>`;
  const st=computeStatus(a),badgeMap={pendente:['badge-pendente','Pendente'],ativo:['badge-ativo','Ativo'],inadimplente:['badge-inadimplente','Inadimplente']};
  const [cls,label]=badgeMap[st],mod=modalidadeInfo(a.modalidade),turma=a.turma,pagador=a.pagador,cobrancas=a.cobrancas||[];
  const stageIndex=a.status==='pendente'?0:(cobrancas.length===0?2:3);
  const stops=['Cadastro','Aprovação','Turma definida','Cobrança ativa'];
  return `
    <button class="back-link" id="backBtn">← Voltar</button>
    <div class="ficha-head">
      <div class="ficha-title">
        <div class="avatar-lg">${initials(a.nome)}</div>
        <div><p class="display">${a.nome}</p><div class="sub">${idade(a.nascimento)} anos · ${a.condominio}</div></div>
      </div>
      <div class="badge-row">
        <span class="badge badge-sport" data-sport="${a.modalidade}">${mod.icon} ${mod.nome}</span>
        <span class="badge ${cls}">${label}</span>
      </div>
    </div>
    <div class="pitch-tracker">
      <div class="pitch-label">Trajetória do atleta</div>
      <div class="pitch-track">
        ${stops.map((s,i)=>`<div class="pitch-stop ${i>stageIndex?'inactive':''}"><div class="pitch-node ${i<stageIndex?'done':''} ${i===stageIndex?'current':''}">${i<stageIndex?'✓':'⚽'}</div><div class="stop-label">${s}</div></div>`).join('')}
      </div>
    </div>
    <div class="info-grid">
      <div class="card info-card">
        <div class="section-label">Atleta</div>
        <div class="info-line"><span class="k">Nascimento</span><span class="v">${fmtDate(a.nascimento)}</span></div>
        <div class="info-line"><span class="k">Unidade</span><span class="v">${a.unidade}</span></div>
        <div class="info-line"><span class="k">Modalidade</span><span class="v">${mod.icon} ${mod.nome}</span></div>
        <div class="info-line"><span class="k">Turma</span><span class="v">${turma?turma.nome+' · '+turma.horario:'Não definida'}</span></div>
        <div class="info-line"><span class="k">Condomínio</span><span class="v">${a.condominio}</span></div>
      </div>
      <div class="card info-card">
        <div class="section-label">Pagador / responsável</div>
        <div class="info-line"><span class="k">Nome</span><span class="v">${pagador.nome}</span></div>
        <div class="info-line"><span class="k">CPF</span><span class="v mono">${pagador.cpf}</span></div>
        <div class="info-line"><span class="k">E-mail</span><span class="v">${pagador.email}</span></div>
        <div class="info-line"><span class="k">Celular</span><span class="v">${pagador.celular}</span></div>
        <div class="info-line"><span class="k">Endereço</span><span class="v">${pagador.logradouro?pagador.logradouro+', '+pagador.numero+' — '+pagador.bairro+', '+pagador.cidade+'/'+pagador.uf:'—'}</span></div>
      </div>
    </div>
    ${a.status==='pendente'?`
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div><div class="section-label" style="margin-top:0;">Aprovação pendente</div><p style="margin:0;color:var(--muted);font-size:13.5px;">Escolha a turma de ${mod.nome} para liberar o cliente no Asaas e habilitar cobranças.</p></div>
        <button class="btn btn-primary" id="aprovarBtn">Aprovar e definir turma</button>
      </div>
    `:`
      <div class="card">
        <div class="hist-head"><p class="display">Histórico de cobranças</p><button class="btn btn-cone btn-sm" id="cobrancaBtn">+ Nova cobrança</button></div>
        ${cobrancas.length?`
          <table><thead><tr><th>Descrição</th><th>Tipo</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr></thead><tbody>
            ${cobrancas.slice().reverse().map(c=>`<tr><td>${c.descricao}</td><td style="text-transform:capitalize;color:var(--muted);">${c.tipo}</td><td>${fmtDate(c.vencimento)}</td><td class="val-cell">${fmtMoney(c.valor)}</td><td><span class="badge badge-${c.status}">${c.status}</span></td></tr>`).join('')}
          </tbody></table>
        `:`<div class="empty-state"><div class="ball">💳</div>Nenhuma cobrança criada ainda.</div>`}
      </div>
    `}
  `;
}
function wireFicha(){
  const back=document.getElementById('backBtn');
  if(back) back.onclick=()=>{ state.selectedTurmaId?navigate('turmaDetalhe'):navigate('painel'); };
  const aprovar=document.getElementById('aprovarBtn'); if(aprovar) aprovar.onclick=()=>{ state.showAprovarModal=state.selectedId; render(); };
  const cobranca=document.getElementById('cobrancaBtn'); if(cobranca) cobranca.onclick=()=>{ state.showCobrancaModal=state.selectedId; render(); };
}

/* ---------- Portal do responsável ---------- */
function renderClientePainel(){
  document.getElementById('appWrap').className='wrap';
  if(state.loading) return loadingHTML();
  const meus=state.clienteAlunos,nome=state.session.nome||'Responsável';
  return `
    <div class="welcome-banner"><p class="display">Olá, ${nome.split(' ')[0]}!</p><p>Acompanhe a matrícula e as cobranças de cada atleta vinculado ao seu CPF.</p></div>
    <div class="section-label">Meus atletas</div>
    <div>${meus.length?meus.map(alunoRowCliente).join(''):`<div class="empty-state"><div class="ball">⚽</div>Nenhum atleta encontrado para esse CPF ainda.</div>`}</div>
  `;
}
function alunoRowCliente(a){
  const st=computeStatus(a),badgeMap={pendente:['badge-pendente','Pendente'],ativo:['badge-ativo','Ativo'],inadimplente:['badge-inadimplente','Inadimplente']};
  const [cls,label]=badgeMap[st],mod=modalidadeInfo(a.modalidade);
  const sub=a.status==='pendente'?`${mod.icon} ${mod.nome} · aguardando aprovação`:`${mod.icon} ${mod.nome} · ${a.turma_nome?a.turma_nome+' · '+a.turma_horario:'sem turma'}`;
  return `<div class="aluno-row" data-id="${a.id}"><div class="avatar">${initials(a.nome)}</div><div class="aluno-info"><div class="nome">${a.nome} <span style="color:var(--muted);font-weight:600;font-size:12.5px;">· ${idade(a.nascimento)} anos</span></div><div class="meta">${sub}</div></div><span class="badge ${cls}">${label}</span><span class="chevron">›</span></div>`;
}
function wireClientePainel(){ document.querySelectorAll('.aluno-row').forEach(r=>{ r.onclick=()=>{ state.selectedId=Number(r.dataset.id); navigate('clienteFilho'); }; }); }

function renderClienteFilho(){
  document.getElementById('appWrap').className='wrap';
  if(state.loading) return loadingHTML();
  const a=state.clienteFilhoDetalhe;
  if(!a) return `<button class="back-link" id="backClienteBtn">← Meus atletas</button><div class="empty-state">Atleta não encontrado.</div>`;
  const st=computeStatus(a),badgeMap={pendente:['badge-pendente','Pendente'],ativo:['badge-ativo','Ativo'],inadimplente:['badge-inadimplente','Inadimplente']};
  const [cls,label]=badgeMap[st],mod=modalidadeInfo(a.modalidade),cobrancas=a.cobrancas||[];
  return `
    <button class="back-link" id="backClienteBtn">← Meus atletas</button>
    <div class="ficha-head">
      <div class="ficha-title"><div class="avatar-lg">${initials(a.nome)}</div><div><p class="display">${a.nome}</p><div class="sub">${idade(a.nascimento)} anos · ${a.unidade}</div></div></div>
      <div class="badge-row"><span class="badge badge-sport" data-sport="${a.modalidade}">${mod.icon} ${mod.nome}</span><span class="badge ${cls}">${label}</span></div>
    </div>
    <div class="card info-card" style="margin-bottom:24px;">
      <div class="section-label">Dados da matrícula</div>
      <div class="info-line"><span class="k">Turma</span><span class="v">${a.turma_nome?a.turma_nome+' · '+a.turma_horario:'Aguardando aprovação'}</span></div>
      <div class="info-line"><span class="k">Condomínio</span><span class="v">${a.condominio}</span></div>
      <div class="info-line"><span class="k">Nascimento</span><span class="v">${fmtDate(a.nascimento)}</span></div>
    </div>
    <div class="card">
      <div class="hist-head"><p class="display">Faturas e cobranças</p></div>
      ${a.status==='pendente'?`<div class="empty-state"><div class="ball">⏳</div>Assim que a matrícula for aprovada, as faturas aparecem aqui.</div>`:
        cobrancas.length?`
          <table><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>
            ${cobrancas.slice().reverse().map(c=>`<tr><td>${c.descricao}</td><td>${fmtDate(c.vencimento)}</td><td class="val-cell">${fmtMoney(c.valor)}</td><td><span class="badge badge-${c.status}">${c.status}</span></td><td>${c.link?`<button class="invoice-btn ${c.status==='pago'?'secondary':''}" data-link="${c.link}">${c.status==='pago'?'Ver recibo':'Pagar fatura'}</button>`:''}</td></tr>`).join('')}
          </tbody></table>
        `:`<div class="empty-state"><div class="ball">💳</div>Nenhuma cobrança gerada ainda.</div>`}
    </div>
  `;
}
function wireClienteFilho(){
  document.getElementById('backClienteBtn').onclick=()=>navigate('clientePainel');
  document.querySelectorAll('.invoice-btn').forEach(b=>{ b.onclick=()=>{ window.open(b.dataset.link,'_blank'); }; });
}

/* ---------- Modais ---------- */
function renderModal(){
  if(state.showAprovarModal){
    const a=state.alunoDetalhe; if(!a) return '';
    const opcoes=state.turmas.filter(t=>t.modalidade===a.modalidade&&t.unidade===a.unidade),mod=modalidadeInfo(a.modalidade);
    return `<div class="modal-overlay" id="overlay"><div class="modal">
      <p class="display">Aprovar atleta</p>
      <p class="modal-sub">${a.nome} · ${mod.icon} ${mod.nome} · ${a.unidade}. Ao confirmar, o cliente é criado no Asaas.</p>
      ${opcoes.length?`
        <div class="field"><label>Turma</label><select id="turmaSelect">${opcoes.map(t=>`<option value="${t.id}">${t.nome} · ${t.horario}</option>`).join('')}</select></div>
        <div class="modal-actions"><button class="btn btn-ghost" id="cancelAprovar">Cancelar</button><button class="btn btn-primary" id="confirmAprovar">Confirmar aprovação</button></div>
      `:`
        <div class="empty-state" style="padding:20px 10px;"><div class="ball">🗂️</div>Ainda não existe turma de ${mod.nome} na unidade ${a.unidade}.</div>
        <div class="modal-actions"><button class="btn btn-ghost" id="cancelAprovar">Cancelar</button><button class="btn btn-cone" id="criarTurmaAtalho">Criar turma agora</button></div>
      `}
    </div></div>`;
  }
  if(state.showCobrancaModal){
    const a=state.alunoDetalhe; if(!a) return '';
    return `<div class="modal-overlay" id="overlay"><div class="modal">
      <p class="display">Nova cobrança</p>
      <p class="modal-sub">Para ${a.pagador.nome} (responsável de ${a.nome})</p>
      <form id="cobrancaForm">
        <div class="field"><label>Tipo de cobrança</label>
          <div class="radio-row"><div class="radio-opt sel" data-tipo="avulsa">Avulsa</div><div class="radio-opt" data-tipo="recorrente">Recorrente (mensal)</div></div>
          <input type="hidden" name="tipo" id="tipoInput" value="avulsa">
        </div>
        <div class="form-grid" style="margin-top:16px;">
          <div class="field"><label>Valor (R$)</label><input required type="number" step="0.01" min="0" name="valor" placeholder="180,00"></div>
          <div class="field"><label>Vencimento</label><input required type="date" name="vencimento"></div>
          <div class="field full"><label>Descrição</label><input required name="descricao" placeholder="Ex: Mensalidade Futsal Sub-9 — Agosto/2026"></div>
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" id="cancelCobranca">Cancelar</button><button type="submit" class="btn btn-cone" id="btnCriarCobranca">Criar cobrança</button></div>
      </form>
    </div></div>`;
  }
  if(state.showTurmaModal){
    const prefill=(typeof state.showTurmaModal==='object')?state.showTurmaModal:{};
    return `<div class="modal-overlay" id="overlay"><div class="modal">
      <p class="display">Nova turma</p>
      <p class="modal-sub">Turmas ficam disponíveis na aprovação de cadastros e no filtro por turma.</p>
      <form id="turmaForm">
        <div class="form-grid">
          <div class="field full"><label>Nome da turma</label><input required name="nome" placeholder="Ex: Sub-9 B"></div>
          <div class="field"><label>Modalidade</label><select required name="modalidade">${modalidades.map(m=>`<option value="${m.id}" ${prefill.modalidade===m.id?'selected':''}>${m.icon} ${m.nome}</option>`).join('')}</select></div>
          <div class="field"><label>Unidade</label><select required name="unidade">${unidades.map(u=>`<option value="${u}" ${prefill.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>
          <div class="field full"><label>Horário</label><input required name="horario" placeholder="Ex: Seg/Qua · 17h"></div>
          <div class="field"><label>Capacidade (opcional)</label><input type="number" min="1" name="capacidade" placeholder="Ex: 16"></div>
        </div>
        <div class="modal-actions"><button type="button" class="btn btn-ghost" id="cancelTurma">Cancelar</button><button type="submit" class="btn btn-cone" id="btnCriarTurma">Criar turma</button></div>
      </form>
    </div></div>`;
  }
  return '';
}
function wireModal(){
  const overlay=document.getElementById('overlay'); if(!overlay) return;
  overlay.onclick=e=>{ if(e.target.id==='overlay'){ state.showAprovarModal=null; state.showCobrancaModal=null; state.showTurmaModal=null; render(); } };
  const cancelAprovar=document.getElementById('cancelAprovar'); if(cancelAprovar) cancelAprovar.onclick=()=>{ state.showAprovarModal=null; render(); };
  const confirmAprovar=document.getElementById('confirmAprovar');
  if(confirmAprovar) confirmAprovar.onclick=async()=>{
    const turmaId=document.getElementById('turmaSelect').value;
    confirmAprovar.disabled=true; confirmAprovar.textContent='Aprovando...';
    try{
      await apiFetch(`/api/alunos/${state.showAprovarModal}/aprovar`,{method:'POST',body:JSON.stringify({turmaId:parseInt(turmaId)})});
      state.showAprovarModal=null; showToast('Atleta aprovado! Credenciais enviadas ao responsável.');
      await carregarFicha(state.selectedId); render();
    }catch(err){ showToast('Erro: '+err.message); confirmAprovar.disabled=false; confirmAprovar.textContent='Confirmar aprovação'; }
  };
  const criarTurmaAtalho=document.getElementById('criarTurmaAtalho');
  if(criarTurmaAtalho) criarTurmaAtalho.onclick=()=>{ const a=state.alunoDetalhe; state.showTurmaModal={modalidade:a.modalidade,unidade:a.unidade,returnToAprovar:a.id}; state.showAprovarModal=null; render(); };
  const cancelCobranca=document.getElementById('cancelCobranca'); if(cancelCobranca) cancelCobranca.onclick=()=>{ state.showCobrancaModal=null; render(); };
  document.querySelectorAll('.radio-opt').forEach(opt=>{ opt.onclick=()=>{ document.querySelectorAll('.radio-opt').forEach(o=>o.classList.remove('sel')); opt.classList.add('sel'); document.getElementById('tipoInput').value=opt.dataset.tipo; }; });
  const cobForm=document.getElementById('cobrancaForm');
  if(cobForm) cobForm.onsubmit=async e=>{
    e.preventDefault(); const f=new FormData(cobForm),btn=document.getElementById('btnCriarCobranca');
    btn.disabled=true; btn.textContent='Criando...';
    try{
      await apiFetch(`/api/alunos/${state.showCobrancaModal}/cobrancas`,{method:'POST',body:JSON.stringify({tipo:f.get('tipo'),valor:parseFloat(f.get('valor')),vencimento:f.get('vencimento'),descricao:f.get('descricao')})});
      state.showCobrancaModal=null; showToast('Cobrança criada com sucesso!'); await carregarFicha(state.selectedId); render();
    }catch(err){ showToast('Erro: '+err.message); btn.disabled=false; btn.textContent='Criar cobrança'; }
  };
  const cancelTurma=document.getElementById('cancelTurma'); if(cancelTurma) cancelTurma.onclick=()=>{ state.showTurmaModal=null; render(); };
  const turmaForm=document.getElementById('turmaForm');
  if(turmaForm) turmaForm.onsubmit=async e=>{
    e.preventDefault(); const f=new FormData(turmaForm),btn=document.getElementById('btnCriarTurma');
    btn.disabled=true; btn.textContent='Criando...';
    try{
      await apiFetch('/api/turmas',{method:'POST',body:JSON.stringify({nome:f.get('nome'),modalidade:f.get('modalidade'),unidade:f.get('unidade'),horario:f.get('horario'),capacidade:f.get('capacidade')?parseInt(f.get('capacidade')):null})});
      const prefill=(typeof state.showTurmaModal==='object')?state.showTurmaModal:{};
      state.showTurmaModal=null; await carregarTurmas();
      if(prefill.returnToAprovar){ state.showAprovarModal=prefill.returnToAprovar; }
      showToast('Turma criada com sucesso!'); render();
    }catch(err){ showToast('Erro: '+err.message); btn.disabled=false; btn.textContent='Criar turma'; }
  };
}

/* ---------- Toast ---------- */
function renderToastOnly(){ const old=document.querySelector('.toast'); if(old) old.remove(); if(toastMsg){ const t=document.createElement('div'); t.className='toast'; t.innerHTML=`<span class="dot"></span> ${toastMsg}`; document.body.appendChild(t); } }

/* ---------- Root render ---------- */
function render(){
  renderTabs();
  const app=document.getElementById('app');
  if(!state.session){ app.innerHTML=state.view==='login'?renderLogin():renderCadastro(); }
  else if(state.session.role==='admin'){
    if(state.view==='ficha') app.innerHTML=renderFicha();
    else if(state.view==='turmas') app.innerHTML=renderTurmas();
    else if(state.view==='turmaDetalhe') app.innerHTML=renderTurmaDetalhe();
    else app.innerHTML=renderPainel();
  } else { app.innerHTML=state.view==='clienteFilho'?renderClienteFilho():renderClientePainel(); }
  app.innerHTML+=renderModal();
  if(!state.session){ state.view==='login'?wireLogin():wireCadastro(); }
  else if(state.session.role==='admin'){
    if(state.view==='ficha') wireFicha();
    else if(state.view==='turmas') wireTurmas();
    else if(state.view==='turmaDetalhe') wireTurmaDetalhe();
    else wirePainel();
  } else { state.view==='clienteFilho'?wireClienteFilho():wireClientePainel(); }
  wireModal(); renderToastOnly();
}

/* ---------- Init ---------- */
if(state.session){ navigate(state.view); } else { render(); }
</script>
</body>
</html>
